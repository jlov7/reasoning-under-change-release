name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - name: Lint
        run: uvx --from ruff==0.17.1 ruff check --no-cache src tests scripts
      - name: Source tests
        run: uv run --no-project --python '${{ matrix.python-version }}' python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          UV_PYTHON_DOWNLOADS: never
      - name: Source distribution to installed wheel and offline jobs
        run: uv run --no-project --python '${{ matrix.python-version }}' python scripts/verify_release.py
        env:
          UV_PYTHON_DOWNLOADS: never
